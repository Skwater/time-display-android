plugins {
    id 'com.android.application'
}

// 签名凭据从根目录 keystore.properties 读取（该文件已被 .gitignore 排除，仅本地保留）。
// 文件缺失时退化为不配置 debug 签名，构建仍可用默认 debug 签名。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def fixedDebugKeystore = file('signing/time-display-debug.keystore')

android {
    namespace 'com.example.timedisplay'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.timedisplay'
        minSdk 28
        targetSdk 35
        versionCode 21
        versionName '0.9.5'
    }

    signingConfigs {
        if (keystorePropsFile.exists() && fixedDebugKeystore.exists()) {
            debug {
                storeFile file(keystoreProps.getProperty('storeFile', 'signing/time-display-debug.keystore'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropsFile.exists() && fixedDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
