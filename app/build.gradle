plugins {
    id 'com.android.application'
}

// 签名凭据从根目录 keystore.properties 读取（该文件已被 .gitignore 排除，仅本地保留）。
// 文件缺失时退化为不配置 debug 签名，构建仍可用默认 debug 签名。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def fixedDebugKeystore = file('signing/time-display-debug.keystore')
def fixedReleaseKeystore = file('signing/time-display-release.keystore')

android {
    namespace 'com.example.timedisplay'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.timedisplay'
        minSdk 28
        targetSdk 35
        versionCode 24
        versionName '0.9.8'
    }

    signingConfigs {
        if (keystorePropsFile.exists() && fixedDebugKeystore.exists()) {
            debug {
                storeFile file(keystoreProps.getProperty('storeFile', 'signing/time-display-debug.keystore'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
        // 正式版签名：凭据取自 keystore.properties 的 release* 字段，密钥存在时才启用。
        if (keystorePropsFile.exists() && fixedReleaseKeystore.exists()) {
            release {
                storeFile file(keystoreProps.getProperty('releaseStoreFile'))
                storePassword keystoreProps.getProperty('releaseStorePassword')
                keyAlias keystoreProps.getProperty('releaseKeyAlias')
                keyPassword keystoreProps.getProperty('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropsFile.exists() && fixedDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            if (keystorePropsFile.exists() && fixedReleaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 离线环境无 lint-gradle 依赖缓存，release 构建禁用 lint vital（其 lint 检查与打包无关）。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
