plugins {
    id 'com.android.application'
}

// 签名凭据从根目录 keystore.properties 读取（该文件已被 .gitignore 排除，仅本地保留）。
// 文件缺失时退化为不配置 debug 签名，构建仍可用默认 debug 签名。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def fixedDebugKeystore = file('signing/time-display-debug.keystore')
def officialReleaseKeystore = file('signing/screen-clock-v1-release.keystore')

android {
    namespace 'com.example.timedisplay'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.skwater.screenclock'
        minSdk 28
        targetSdk 36
        versionCode 33
        versionName '1.0.0'
    }

    signingConfigs {
        if (keystorePropsFile.exists() && fixedDebugKeystore.exists()) {
            debug {
                storeFile file(keystoreProps.getProperty('storeFile', 'signing/time-display-debug.keystore'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
        // 正式版签名使用独立密钥；凭据仅保存在本地、被 Git 忽略的 keystore.properties。
        if (keystorePropsFile.exists() && officialReleaseKeystore.exists()) {
            release {
                storeFile officialReleaseKeystore
                storePassword keystoreProps.getProperty('officialStorePassword')
                keyAlias keystoreProps.getProperty('officialKeyAlias')
                keyPassword keystoreProps.getProperty('officialKeyPassword')
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropsFile.exists() && fixedDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            if (keystorePropsFile.exists() && officialReleaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 离线环境无 lint-gradle 依赖缓存，release 构建禁用 lint vital（其 lint 检查与打包无关）。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
